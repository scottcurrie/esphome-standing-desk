external_components:
  - source:
      type: local
      path: components
    components: [ standing_desk_height ]

substitutions:
  desk_height_name: "Desk Height"
  target_desk_height_name: "Target Desk Height"
  standing_desk_height_units: "cm"
  standing_desk_variant: "wn17cm3"

uart:
  id: standing_desk_uart
  rx_pin: ${standing_desk_uart_rx_pin}
  tx_pin: ${standing_desk_uart_tx_pin}
  baud_rate: 19200

sensor:
  - platform: standing_desk_height
    id: desk_height
    name: ${desk_height_name}
    unit_of_measurement: ${standing_desk_height_units}
    variant: ${standing_desk_variant}

number:
  - platform: template
    id: target_desk_height
    name: ${target_desk_height_name}
    unit_of_measurement: ${standing_desk_height_units}
    restore_value: true
    optimistic: true
    min_value: ${standing_desk_min_height}
    max_value: ${standing_desk_max_height}
    step: 0.1
    set_action:
      then:
        - if:
            condition:
              lambda: "return id(desk_height)->get_last_read() > x;"
            then:
              - standing_desk_height.move_down: desk_height
              - wait_until:
                  condition:
                    lambda: "return id(desk_height)->get_last_read() <= x + 0.4;"
                  timeout: 20s
              - standing_desk_height.stop: desk_height
            else:
              - standing_desk_height.move_up: desk_height
              - wait_until:
                  condition:
                    lambda: "return id(desk_height)->get_last_read() >= x - 0.4;"
                  timeout: 20s
              - standing_desk_height.stop: desk_height

button:
  - platform: template
    name: "Desk Up"
    icon: mdi:arrow-up-bold
    on_press:
      - standing_desk_height.move_up: desk_height
      - delay: 100ms
      - standing_desk_height.stop: desk_height

  - platform: template
    name: "Desk Down"
    icon: mdi:arrow-down-bold
    on_press:
      - standing_desk_height.move_down: desk_height
      - delay: 100ms
      - standing_desk_height.stop: desk_height

  - platform: template
    name: "Desk Preset 1"
    icon: mdi:numeric-1-box
    on_press:
      - standing_desk_height.preset:
          id: desk_height
          preset: 1

  - platform: template
    name: "Desk Preset 2"
    icon: mdi:numeric-2-box
    on_press:
      - standing_desk_height.preset:
          id: desk_height
          preset: 2

  - platform: template
    name: "Desk Preset 3"
    icon: mdi:numeric-3-box
    on_press:
      - standing_desk_height.preset:
          id: desk_height
          preset: 3

  - platform: template
    name: "Desk Preset 4"
    icon: mdi:numeric-4-box
    on_press:
      - standing_desk_height.preset:
          id: desk_height
          preset: 4

# Switches for hold-to-move control (use with Lovelace button-card hold_action)
switch:
  - platform: template
    name: "Desk Move Up"
    id: desk_move_up
    icon: mdi:arrow-up-bold
    optimistic: true
    turn_on_action:
      - standing_desk_height.move_up: desk_height
    turn_off_action:
      - standing_desk_height.stop: desk_height

  - platform: template
    name: "Desk Move Down"
    id: desk_move_down
    icon: mdi:arrow-down-bold
    optimistic: true
    turn_on_action:
      - standing_desk_height.move_down: desk_height
    turn_off_action:
      - standing_desk_height.stop: desk_height
