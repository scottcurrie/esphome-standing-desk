# Platform Master Configuration for Synchronized Lift Platform
# The master ESP32 connects directly to Desk 1 and coordinates all other desks via ESP-NOW
#
# Hardware: ESP32 DevKit connected to WN17CM3 desk controller via RJ45
# Wiring:
#   RJ45 Pin 2 (Blue)   -> GPIO17 (TX2)
#   RJ45 Pin 3 (Black)  -> GND
#   RJ45 Pin 4 (Yellow) -> GPIO16 (RX2)
#   RJ45 Pin 5 (Red)    -> VIN (5V power from desk)

substitutions:
  device_name: platform-master
  # MAC addresses of the four slave boards (WiFi STA MAC, printed in each slave's
  # boot log). REPLACE these placeholders before flashing — ESP-NOW unicast sends
  # and on_receive only work for correctly listed peers.
  # Note: ESP-NOW inherits the WiFi channel in ESPHome 2025.11 (channel: is
  # rejected when wifi: is configured) — ensure all five boards associate to the
  # same AP/channel (pin the AP channel on mesh/multi-AP networks).
  desk_2_mac: "00:00:00:00:00:02"
  desk_3_mac: "00:00:00:00:00:03"
  desk_4_mac: "00:00:00:00:00:04"
  desk_5_mac: "00:00:00:00:00:05"

esphome:
  name: ${device_name}
  friendly_name: "Platform Controller"
  on_boot:
    priority: 200
    then:
      - lambda: |-
          ESP_LOGI("platform_master", "===========================================");
          ESP_LOGI("platform_master", "Platform Master Controller booting...");
          ESP_LOGI("platform_master", "Firmware version: 2025-12-13-local-component/master");
          ESP_LOGI("platform_master", "UART RX: GPIO16, TX: GPIO17");
          ESP_LOGI("platform_master", "===========================================");
      - lambda: |-
          // Wire the sync controller's per-desk commands ("U"/"D"/"S"/"P<n>") to
          // ESP-NOW unicast. Requires PlatformSyncController::set_send_callback()
          // in components/platform_sync_controller.
          id(platform_controller).set_send_callback([](uint8_t desk_id, const char *cmd) {
            if (desk_id == 1) {
              // Desk 1 is the master's directly connected desk — drive it over UART.
              // (Re-send while moving is handled by the controller's control loop.)
              if (strcmp(cmd, "U") == 0) {
                id(desk_1_height).move_up();
              } else if (strcmp(cmd, "D") == 0) {
                id(desk_1_height).move_down();
              } else if (cmd[0] == 'P' && cmd[1] >= '1' && cmd[1] <= '4') {
                id(desk_1_height).preset(cmd[1] - '0');
              } else {
                id(desk_1_height).stop();
              }
              return;
            }
            if (desk_id < 2 || desk_id > 5)
              return;
            // Desk ID -> MAC table from substitutions, parsed once
            static const char *desk_mac_strs[4] = {
                "${desk_2_mac}", "${desk_3_mac}", "${desk_4_mac}", "${desk_5_mac}"};
            static uint8_t desk_macs[4][6];
            static bool macs_parsed = false;
            if (!macs_parsed) {
              for (int i = 0; i < 4; i++) {
                unsigned int b[6] = {0};
                sscanf(desk_mac_strs[i], "%x:%x:%x:%x:%x:%x",
                       &b[0], &b[1], &b[2], &b[3], &b[4], &b[5]);
                for (int j = 0; j < 6; j++)
                  desk_macs[i][j] = (uint8_t) b[j];
              }
              macs_parsed = true;
            }
            // Queued, non-blocking send — safe to call from the 20Hz control loop
            id(espnow_component)->send(desk_macs[desk_id - 2],
                                       reinterpret_cast<const uint8_t *>(cmd), strlen(cmd));
          });

esp32:
  board: esp32dev
  framework:
    type: arduino

# WiFi for Home Assistant connection
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  ap:
    ssid: "${device_name}-fallback"
    password: "platform12345"

captive_portal:

# Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# OTA updates
ota:
  platform: esphome
  password: !secret ota_password

logger:
  level: DEBUG
  # Serial (USB) logging stays enabled: the desk UART is on GPIO16/17 (UART2),
  # which does not conflict with UART0 logging on ESP32

# Web server for debugging
web_server:
  port: 80

# External components (local development)
external_components:
  - source:
      type: local
      path: ../../components
    components: [standing_desk_height, platform_sync_controller]

# UART for local desk 1 (master connects directly to one desk)
uart:
  id: standing_desk_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 19200

# Local desk 1 height sensor (master's directly connected desk)
sensor:
  - platform: standing_desk_height
    id: desk_1_height
    name: "Desk 1 Height"
    unit_of_measurement: "cm"
    variant: wn17cm3
    update_interval: 100ms
    accuracy_decimals: 2
    on_value:
      then:
        - lambda: |-
            // Report desk 1 height to sync controller
            id(platform_controller).on_height_received(1, x);

  # Platform sensors (from sync controller)
  - platform: template
    name: "Platform Height"
    id: platform_height
    unit_of_measurement: "cm"
    accuracy_decimals: 2
    lambda: return id(platform_controller).get_platform_height();
    update_interval: 250ms

  - platform: template
    name: "Platform Max Spread"
    id: platform_spread
    unit_of_measurement: "cm"
    accuracy_decimals: 2
    lambda: return id(platform_controller).get_max_spread();
    update_interval: 250ms

  - platform: template
    name: "Platform Min Height"
    id: platform_min_height
    unit_of_measurement: "cm"
    accuracy_decimals: 2
    lambda: return id(platform_controller).get_min_height();
    update_interval: 250ms

  - platform: template
    name: "Platform Max Height"
    id: platform_max_height
    unit_of_measurement: "cm"
    accuracy_decimals: 2
    lambda: return id(platform_controller).get_max_height();
    update_interval: 250ms

  # Individual desk heights as seen by the sync controller (ESP-NOW mirrors).
  # Named "(Sync View)" so they can't be mistaken for the slaves' live UART
  # sensors ("Desk N Height") when debugging heights in HA.
  - platform: template
    name: "Desk 2 Height (Sync View)"
    id: desk_2_height_sensor
    entity_category: diagnostic
    unit_of_measurement: "cm"
    accuracy_decimals: 2
    lambda: return id(platform_controller).get_desk_height(2);
    update_interval: 500ms

  - platform: template
    name: "Desk 3 Height (Sync View)"
    id: desk_3_height_sensor
    entity_category: diagnostic
    unit_of_measurement: "cm"
    accuracy_decimals: 2
    lambda: return id(platform_controller).get_desk_height(3);
    update_interval: 500ms

  - platform: template
    name: "Desk 4 Height (Sync View)"
    id: desk_4_height_sensor
    entity_category: diagnostic
    unit_of_measurement: "cm"
    accuracy_decimals: 2
    lambda: return id(platform_controller).get_desk_height(4);
    update_interval: 500ms

  - platform: template
    name: "Desk 5 Height (Sync View)"
    id: desk_5_height_sensor
    entity_category: diagnostic
    unit_of_measurement: "cm"
    accuracy_decimals: 2
    lambda: return id(platform_controller).get_desk_height(5);
    update_interval: 500ms

  # WiFi signal for debugging
  - platform: wifi_signal
    name: "Master WiFi Signal"
    update_interval: 60s

  # Uptime
  - platform: uptime
    name: "Master Uptime"
    update_interval: 60s

# Platform sync controller component
platform_sync_controller:
  id: platform_controller
  pause_threshold: 0.3      # Pause desk if ahead by 0.3cm
  resume_threshold: 0.2     # Resume when within 0.2cm of slowest
  emergency_threshold: 1.0  # Emergency stop if spread > 1.0cm
  comm_timeout: 250         # Stop if desk doesn't report for 250ms
  num_desks: 5              # Total desks including master's desk 1.
                            # Set to 2 or 3 for the first bench sync test — the master
                            # refuses ALL movement until every desk 1..num_desks reports
                            # within comm_timeout. Slaves must use contiguous desk_ids
                            # starting at 2.
  control_loop_interval: 50 # Run sync algorithm at ~20Hz

# Binary sensors for status
binary_sensor:
  - platform: template
    name: "Platform Moving"
    id: platform_moving
    lambda: return id(platform_controller).is_moving();

  - platform: template
    name: "Platform Error"
    id: platform_error
    device_class: problem
    lambda: return id(platform_controller).has_error();

  - platform: template
    name: "All Desks Responding"
    id: all_desks_ok
    device_class: connectivity
    lambda: return id(platform_controller).all_desks_responding();

# Text sensor for error messages
text_sensor:
  - platform: template
    name: "Platform Status"
    id: platform_status
    lambda: |-
      auto state = id(platform_controller).get_platform_state();
      switch (state) {
        case platform_sync_controller::PlatformState::IDLE:
          return std::string("Idle");
        case platform_sync_controller::PlatformState::MOVING_UP:
          return std::string("Moving Up");
        case platform_sync_controller::PlatformState::MOVING_DOWN:
          return std::string("Moving Down");
        case platform_sync_controller::PlatformState::MOVING_TO_HEIGHT:
          return std::string("Moving to Height");
        case platform_sync_controller::PlatformState::ERROR:
          return std::string("ERROR");
        default:
          return std::string("Unknown");
      }
    update_interval: 1s

  - platform: template
    name: "Platform Error Message"
    id: platform_error_message
    lambda: |-
      return std::string(id(platform_controller).get_error_message());
    update_interval: 1s

# Platform control buttons
button:
  - platform: template
    name: "Platform Up"
    icon: mdi:arrow-up-bold
    on_press:
      - lambda: id(platform_controller).move_up();

  - platform: template
    name: "Platform Down"
    icon: mdi:arrow-down-bold
    on_press:
      - lambda: id(platform_controller).move_down();

  - platform: template
    name: "Platform Stop"
    icon: mdi:stop
    on_press:
      - lambda: id(platform_controller).stop();

  - platform: template
    name: "Platform Emergency Stop"
    icon: mdi:alert-octagon
    on_press:
      - lambda: id(platform_controller).emergency_stop("Manual emergency stop");

  - platform: template
    name: "Clear Platform Error"
    icon: mdi:alert-circle-check
    on_press:
      - lambda: id(platform_controller).clear_error();

  - platform: template
    name: "Platform Preset 1"
    icon: mdi:numeric-1-box
    on_press:
      - lambda: id(platform_controller).preset(1);

  - platform: template
    name: "Platform Preset 2"
    icon: mdi:numeric-2-box
    on_press:
      - lambda: id(platform_controller).preset(2);

  - platform: template
    name: "Platform Preset 3"
    icon: mdi:numeric-3-box
    on_press:
      - lambda: id(platform_controller).preset(3);

  - platform: template
    name: "Platform Preset 4"
    icon: mdi:numeric-4-box
    on_press:
      - lambda: id(platform_controller).preset(4);

  # Local desk 1 controls (for testing without sync).
  # These drive the desk_1_move_up/down hold switches so the 100ms re-send
  # interval keeps the desk moving — a single move command only nudges the desk
  # a tiny amount (Dec 13 hardware finding).
  - platform: template
    name: "Desk 1 Up (Local)"
    icon: mdi:arrow-up
    entity_category: diagnostic
    on_press:
      - switch.turn_on: desk_1_move_up
      - delay: 500ms
      - switch.turn_off: desk_1_move_up

  - platform: template
    name: "Desk 1 Down (Local)"
    icon: mdi:arrow-down
    entity_category: diagnostic
    on_press:
      - switch.turn_on: desk_1_move_down
      - delay: 500ms
      - switch.turn_off: desk_1_move_down

  - platform: restart
    name: "Master Restart"

# Target height number input
number:
  - platform: template
    name: "Platform Target Height"
    id: platform_target
    unit_of_measurement: "cm"
    min_value: 60
    max_value: 125
    step: 0.5
    optimistic: true
    restore_value: true
    set_action:
      - lambda: id(platform_controller).move_to_height(x);

# ESP-NOW link to the slave desks.
# ESP-NOW inherits the WiFi channel in ESPHome 2025.11 (channel: is rejected when
# wifi: is configured) — ensure all five boards associate to the same AP/channel.
espnow:
  id: espnow_component
  # on_receive only fires for registered peers — the slave MACs must be correct
  peers:
    - ${desk_2_mac}
    - ${desk_3_mac}
    - ${desk_4_mac}
    - ${desk_5_mac}
  on_receive:
    - lambda: |-
        // Parse height reports from slaves: "H<id>:<height>"
        std::string msg(reinterpret_cast<const char *>(data), size);
        ESP_LOGV("espnow", "Received: %s", msg.c_str());

        if (msg.length() >= 4 && msg[0] == 'H') {
          // Parse "H2:72.35"
          uint8_t desk_id = msg[1] - '0';
          size_t colon_pos = msg.find(':');
          if (colon_pos != std::string::npos && colon_pos + 1 < msg.length()) {
            float height = strtof(msg.c_str() + colon_pos + 1, nullptr);
            id(platform_controller).on_height_received(desk_id, height);
          }
        }

# Status LED
status_led:
  pin: GPIO2

# Switches for hold-to-move control (use with Lovelace button-card hold_action)
switch:
  - platform: template
    name: "Platform Move Up"
    id: platform_move_up
    icon: mdi:arrow-up-bold
    optimistic: true
    turn_on_action:
      - lambda: id(platform_controller).move_up();
    turn_off_action:
      - lambda: id(platform_controller).stop();

  - platform: template
    name: "Platform Move Down"
    id: platform_move_down
    icon: mdi:arrow-down-bold
    optimistic: true
    turn_on_action:
      - lambda: id(platform_controller).move_down();
    turn_off_action:
      - lambda: id(platform_controller).stop();

  # Local desk 1 hold-to-move (diagnostic, bypasses the sync controller)
  - platform: template
    name: "Desk 1 Move Up (Local)"
    id: desk_1_move_up
    icon: mdi:arrow-up
    entity_category: diagnostic
    optimistic: true
    turn_off_action:
      - standing_desk_height.stop: desk_1_height

  - platform: template
    name: "Desk 1 Move Down (Local)"
    id: desk_1_move_down
    icon: mdi:arrow-down
    entity_category: diagnostic
    optimistic: true
    turn_off_action:
      - standing_desk_height.stop: desk_1_height

# Interval to re-send move commands while a local desk 1 hold switch is on
# (the WN17CM3 only moves while the command is re-sent ~every 100ms)
interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (id(desk_1_move_up).state) {
            id(desk_1_height).move_up();
          } else if (id(desk_1_move_down).state) {
            id(desk_1_height).move_down();
          }
