# Status LED
status_led:
  pin: GPIO2

# Switches for hold-to-move control (use with Lovelace button-card hold_action)
switch:
  - platform: template
    name: "Platform Move Up"
    id: platform_move_up
    icon: mdi:arrow-up-bold
    optimistic: true
    turn_on_action:
      - lambda: id(platform_controller).move_up();
    turn_off_action:
      - lambda: id(platform_controller).stop();

  - platform: template
    name: "Platform Move Down"
    id: platform_move_down
    icon: mdi:arrow-down-bold
    optimistic: true
    turn_on_action:
      - lambda: id(platform_controller).move_down();
    turn_off_action:
      - lambda: id(platform_controller).stop();

# Interval for simulated height updates (for testing without ESP-NOW)
# Remove this when ESP-NOW is configured
interval:
  - interval: 500ms
    then:
      - lambda: |-
          // Simulated height updates for testing (remove when ESP-NOW is working)
          // This simulates all desks at the same height as desk 1
          float h1 = id(desk_1_height).state;
          if (!isnan(h1) && h1 > 0) {
            // Simulate desks 2-5 with slight variations
            id(platform_controller).on_height_received(2, h1 + 0.05);
            id(platform_controller).on_height_received(3, h1 - 0.03);
            id(platform_controller).on_height_received(4, h1 + 0.02);
            id(platform_controller).on_height_received(5, h1 - 0.01);
          }
