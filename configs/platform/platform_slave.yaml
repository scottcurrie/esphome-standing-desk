# Platform Slave Configuration for Synchronized Lift Platform
# Each slave desk (2-5) runs this configuration with a unique desk_id
#
# Usage:
#   1. Copy this file for each slave desk
#   2. Change desk_id substitution to 2, 3, 4, or 5
#   3. Set standalone_mode to "true" for individual testing
#
# Hardware: ESP32 DevKit connected to WN17CM3 desk controller via RJ45
# Wiring:
#   RJ45 Pin 2 (Blue)   -> GPIO17 (TX2)
#   RJ45 Pin 3 (Black)  -> GND
#   RJ45 Pin 4 (Yellow) -> GPIO16 (RX2)
#   RJ45 Pin 5 (Red)    -> VIN (5V power from desk)

substitutions:
  # desk_id MUST be edited before flashing each board (2, 3, 4, or 5).
  # A duplicate desk_id produces a duplicate hostname (platform-desk-N), so
  # mDNS/OTA can target the wrong board.
  desk_id: "2"
  device_name: platform-desk-${desk_id}
  standalone_mode: "false"  # Set "true" for individual desk testing without master
  # MAC address of the master board (WiFi STA MAC, printed in its boot log).
  # REPLACE this placeholder before flashing — height reports are unicast to it,
  # and on_receive only fires for registered peers.
  # Note: ESP-NOW inherits the WiFi channel in ESPHome 2025.11 (channel: is
  # rejected when wifi: is configured) — ensure all five boards associate to the
  # same AP/channel (pin the AP channel on mesh/multi-AP networks).
  master_mac: "4C:C3:82:0D:16:C4"  # ROLE SWAP 2026-07-27: board 1 is now the master

esphome:
  name: ${device_name}
  friendly_name: "Platform Desk ${desk_id}"
  on_boot:
    priority: 200
    then:
      - lambda: |-
          ESP_LOGI("platform_slave", "===========================================");
          ESP_LOGI("platform_slave", "Platform Desk ${desk_id} booting...");
          ESP_LOGI("platform_slave", "Firmware version: 2025-12-13-local-component/slave");
          ESP_LOGI("platform_slave", "UART RX: GPIO16, TX: GPIO17");
          ESP_LOGI("platform_slave", "Standalone mode: ${standalone_mode}");
          ESP_LOGI("platform_slave", "===========================================");

esp32:
  board: esp32dev
  framework:
    type: arduino

# WiFi - always enabled for OTA and logging
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  ap:
    ssid: "${device_name}-fallback"
    password: "desk12345"

captive_portal:

# API for Home Assistant - useful in standalone mode
api:
  encryption:
    key: !secret api_encryption_key

# OTA updates
ota:
  platform: esphome
  password: !secret ota_password

logger:
  level: DEBUG
  # Serial (USB) logging stays enabled: the desk UART is on GPIO16/17 (UART2),
  # which does not conflict with UART0 logging on ESP32

# Built-in web UI (http://platform-desk-N.local) — lets the bench test run with
# no Home Assistant dependency: switches/buttons are operable from any browser
web_server:
  port: 80

# External component for desk height sensing (local development)
external_components:
  - source:
      type: local
      path: ../../components
    components: [standing_desk_height]

# UART for desk communication (WN17CM3 @ 19200 baud)
uart:
  id: standing_desk_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 19200

# Global variables for state tracking
globals:
  - id: current_command
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: is_moving
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_height_report_time
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Desk height sensor
sensor:
  - platform: standing_desk_height
    id: desk_height
    name: "Desk ${desk_id} Height"
    unit_of_measurement: "cm"
    # This desk model reports INCHES over UART (verified on hardware
    # 2026-07-27). Convert to cm so height reports to the master match the
    # sync controller's cm-based thresholds.
    filters:
      - multiply: 2.54
    variant: wn17cm3
    update_interval: 100ms  # Fast updates for sync
    accuracy_decimals: 2
    on_value:
      then:
        - lambda: |-
            // Report height to master via ESP-NOW when not in standalone mode
            // Height reports are sent at ~10Hz or on significant change
            static float last_reported = 0;
            uint32_t now = millis();
            float height = id(desk_height).state;

            // Report if: enough time passed OR height changed significantly
            bool time_elapsed = (now - id(last_height_report_time)) >= 100;  // 10Hz
            bool height_changed = abs(height - last_reported) >= 0.05;  // 0.5mm change

            if ((time_elapsed || height_changed) && !isnan(height)) {
              id(last_height_report_time) = now;
              last_reported = height;

              // Format: "H<id>:<height>" e.g., "H2:72.35"
              char msg[16];
              snprintf(msg, sizeof(msg), "H${desk_id}:%.2f", height);

              if (std::string("${standalone_mode}") != "true") {
                static uint8_t master_mac[6];
                static bool mac_parsed = false;
                if (!mac_parsed) {
                  unsigned int b[6] = {0};
                  sscanf("${master_mac}", "%x:%x:%x:%x:%x:%x",
                         &b[0], &b[1], &b[2], &b[3], &b[4], &b[5]);
                  for (int i = 0; i < 6; i++)
                    master_mac[i] = (uint8_t) b[i];
                  mac_parsed = true;
                }
                // The callback is REQUIRED, not optional: espnow in ESPHome
                // 2025.11.5 invokes the callback on send completion WITHOUT a
                // null check, so the default nullptr callback crashes the
                // firmware on the first completed send (verified on hardware
                // 2026-07-27; boards crash-looped into safe mode).
                id(espnow_component)->send(master_mac,
                    reinterpret_cast<const uint8_t *>(msg), strlen(msg),
                    [](esp_err_t status) {
                      static uint32_t last_warn = 0;
                      if (status != ESP_OK && millis() - last_warn > 5000) {
                        last_warn = millis();
                        ESP_LOGW("platform_slave",
                                 "ESP-NOW height report failing (status %d) - "
                                 "master offline or on another WiFi channel "
                                 "(mesh nodes)?", (int) status);
                      }
                    });
              }
            }

  # WiFi signal for debugging
  - platform: wifi_signal
    name: "Desk ${desk_id} WiFi Signal"
    update_interval: 60s

  # Uptime sensor
  - platform: uptime
    name: "Desk ${desk_id} Uptime"
    update_interval: 60s

# Binary sensor for movement status
binary_sensor:
  - platform: template
    name: "Desk ${desk_id} Moving"
    id: desk_moving
    lambda: return id(is_moving);

# Text sensor for current command/status
text_sensor:
  - platform: template
    name: "Desk ${desk_id} Status"
    id: desk_status
    lambda: |-
      if (id(is_moving)) {
        return id(current_command);
      }
      return std::string("idle");
    update_interval: 1s

# ESP-NOW link to the master.
# ESP-NOW inherits the WiFi channel in ESPHome 2025.11 (channel: is rejected when
# wifi: is configured) — ensure all five boards associate to the same AP/channel.
espnow:
  id: espnow_component
  # on_receive only fires for registered peers — the master MAC must be correct
  peers:
    - ${master_mac}
  on_receive:
    - lambda: |-
        std::string cmd(reinterpret_cast<const char *>(data), size);
        ESP_LOGD("platform_slave", "Received command: %s", cmd.c_str());

        // Handle individual commands (no prefix) or broadcast (*prefix)
        bool is_broadcast = !cmd.empty() && cmd[0] == '*';
        std::string actual_cmd = is_broadcast ? cmd.substr(1) : cmd;

        if (actual_cmd == "U") {
          // Latch direction via the hold switch — the 100ms interval below
          // re-sends move_up while it is on (a single command only nudges
          // the desk; Dec 13 hardware finding)
          if (id(desk_move_down).state)
            id(desk_move_down).turn_off();
          id(desk_move_up).turn_on();
        } else if (actual_cmd == "D") {
          if (id(desk_move_up).state)
            id(desk_move_up).turn_off();
          id(desk_move_down).turn_on();
        } else if (actual_cmd == "S") {
          if (id(desk_move_up).state)
            id(desk_move_up).turn_off();
          if (id(desk_move_down).state)
            id(desk_move_down).turn_off();
          // Always send an explicit stop (covers preset motion too)
          id(desk_height)->stop();
          id(is_moving) = false;
          id(current_command) = "";
        } else if (actual_cmd.length() == 2 && actual_cmd[0] == 'P' &&
                   actual_cmd[1] >= '1' && actual_cmd[1] <= '4') {
          id(desk_height)->preset(actual_cmd[1] - '0');
          id(is_moving) = true;
          id(current_command) = std::string("PRESET") + actual_cmd[1];
        }

# Local control buttons (always available for testing)
# Up/Down drive the hold switches so the 100ms re-send interval keeps the desk
# moving — a single move command only nudges the desk (Dec 13 hardware finding).
button:
  - platform: template
    name: "Desk ${desk_id} Up"
    icon: mdi:arrow-up-bold
    entity_category: diagnostic
    on_press:
      - switch.turn_on: desk_move_up
      - delay: 500ms
      - switch.turn_off: desk_move_up

  - platform: template
    name: "Desk ${desk_id} Down"
    icon: mdi:arrow-down-bold
    entity_category: diagnostic
    on_press:
      - switch.turn_on: desk_move_down
      - delay: 500ms
      - switch.turn_off: desk_move_down

  - platform: template
    name: "Desk ${desk_id} Stop"
    icon: mdi:stop
    on_press:
      - lambda: |-
          id(desk_height)->stop();
          id(is_moving) = false;
          id(current_command) = "";

  - platform: template
    name: "Desk ${desk_id} Preset 1"
    icon: mdi:numeric-1-box
    on_press:
      - lambda: |-
          id(desk_height)->preset(1);
          id(is_moving) = true;
          id(current_command) = "PRESET1";

  - platform: template
    name: "Desk ${desk_id} Preset 2"
    icon: mdi:numeric-2-box
    on_press:
      - lambda: |-
          id(desk_height)->preset(2);
          id(is_moving) = true;
          id(current_command) = "PRESET2";

  - platform: template
    name: "Desk ${desk_id} Preset 3"
    icon: mdi:numeric-3-box
    on_press:
      - lambda: |-
          id(desk_height)->preset(3);
          id(is_moving) = true;
          id(current_command) = "PRESET3";

  - platform: template
    name: "Desk ${desk_id} Preset 4"
    icon: mdi:numeric-4-box
    on_press:
      - lambda: |-
          id(desk_height)->preset(4);
          id(is_moving) = true;
          id(current_command) = "PRESET4";

  - platform: restart
    name: "Desk ${desk_id} Restart"

# Status LED
status_led:
  pin: GPIO2

# Switches for hold-to-move control (use with Lovelace button-card hold_action)
switch:
  - platform: template
    name: "Desk ${desk_id} Move Up"
    id: desk_move_up
    icon: mdi:arrow-up-bold
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(is_moving) = true;
          id(current_command) = "UP";
    turn_off_action:
      - lambda: |-
          id(desk_height)->stop();
          id(is_moving) = false;
          id(current_command) = "";

  - platform: template
    name: "Desk ${desk_id} Move Down"
    id: desk_move_down
    icon: mdi:arrow-down-bold
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(is_moving) = true;
          id(current_command) = "DOWN";
    turn_off_action:
      - lambda: |-
          id(desk_height)->stop();
          id(is_moving) = false;
          id(current_command) = "";

# Interval to send repeated commands while switch is on
interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (id(desk_move_up).state) {
            id(desk_height)->move_up();
          } else if (id(desk_move_down).state) {
            id(desk_height)->move_down();
          }
