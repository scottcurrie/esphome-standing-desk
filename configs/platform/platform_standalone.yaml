# Local control buttons (always available for testing)
button:
  - platform: template
    name: "Desk ${desk_id} Up"
    icon: mdi:arrow-up-bold
    on_press:
      - lambda: |-
          id(desk_height)->move_up();
          id(is_moving) = true;
          id(current_command) = "UP";
      - delay: 100ms
      - lambda: |-
          id(desk_height)->stop();
          id(is_moving) = false;
          id(current_command) = "";

  - platform: template
    name: "Desk ${desk_id} Down"
    icon: mdi:arrow-down-bold
    on_press:
      - lambda: |-
          id(desk_height)->move_down();
          id(is_moving) = true;
          id(current_command) = "DOWN";
      - delay: 100ms
      - lambda: |-
          id(desk_height)->stop();
          id(is_moving) = false;
          id(current_command) = "";

  - platform: template
    name: "Desk ${desk_id} Stop"
    icon: mdi:stop
    on_press:
      - lambda: |-
          id(desk_height)->stop();
          id(is_moving) = false;
          id(current_command) = "";

  - platform: template
    name: "Desk ${desk_id} Preset 1"
    icon: mdi:numeric-1-box
    on_press:
      - lambda: |-
          id(desk_height)->preset(1);
          id(is_moving) = true;
          id(current_command) = "PRESET1";

  - platform: template
    name: "Desk ${desk_id} Preset 2"
    icon: mdi:numeric-2-box
    on_press:
      - lambda: |-
          id(desk_height)->preset(2);
          id(is_moving) = true;
          id(current_command) = "PRESET2";

  - platform: template
    name: "Desk ${desk_id} Preset 3"
    icon: mdi:numeric-3-box
    on_press:
      - lambda: |-
          id(desk_height)->preset(3);
          id(is_moving) = true;
          id(current_command) = "PRESET3";

  - platform: template
    name: "Desk ${desk_id} Preset 4"
    icon: mdi:numeric-4-box
    on_press:
      - lambda: |-
          id(desk_height)->preset(4);
          id(is_moving) = true;
          id(current_command) = "PRESET4";

  - platform: restart
    name: "Desk ${desk_id} Restart"

# Status LED
status_led:
  pin: GPIO2

# Switches for hold-to-move control (use with Lovelace button-card hold_action)
switch:
  - platform: template
    name: "Desk ${desk_id} Move Up"
    id: desk_move_up
    icon: mdi:arrow-up-bold
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(is_moving) = true;
          id(current_command) = "UP";
    turn_off_action:
      - lambda: |-
          id(desk_height)->stop();
          id(is_moving) = false;
          id(current_command) = "";

  - platform: template
    name: "Desk ${desk_id} Move Down"
    id: desk_move_down
    icon: mdi:arrow-down-bold
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(is_moving) = true;
          id(current_command) = "DOWN";
    turn_off_action:
      - lambda: |-
          id(desk_height)->stop();
          id(is_moving) = false;
          id(current_command) = "";

# Interval to send repeated commands while switch is on
interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (id(desk_move_up).state) {
            id(desk_height)->move_up();
          } else if (id(desk_move_down).state) {
            id(desk_height)->move_down();
          }
