# Platform Standalone Configuration — single-desk hardware test, no master required
#
# Usage:
#   Flash one board with this file to bench-test a single desk (UART wiring,
#   height decoding, hold-to-move) without the master or ESP-NOW.
#   desk_id 1 is fine for standalone — the device is named
#   platform-desk-${desk_id}-standalone so it can never impersonate a
#   platform board (the master's desk 1 or a slave) on mDNS/OTA.
#
# Hardware: ESP32 DevKit connected to WN17CM3 desk controller via RJ45
# Wiring:
#   RJ45 Pin 2 (Blue)   -> GPIO17 (TX) via level shifter
#   RJ45 Pin 3 (Black)  -> GND
#   RJ45 Pin 4 (Yellow) -> GPIO16 (RX) via level shifter
#   RJ45 Pin 5 (Red)    -> VIN (5V power) and level shifter HV

substitutions:
  desk_id: "1"  # desk_id 1 is fine for standalone testing
  device_name: platform-desk-${desk_id}-standalone
  standalone_mode: "true"

esphome:
  name: ${device_name}
  friendly_name: "Standalone Desk ${desk_id}"
  on_boot:
    priority: 200
    then:
      - lambda: |-
          ESP_LOGI("platform_standalone", "===========================================");
          ESP_LOGI("platform_standalone", "Standalone Desk ${desk_id} booting...");
          ESP_LOGI("platform_standalone", "Firmware version: 2025-12-13-local-component/standalone");
          ESP_LOGI("platform_standalone", "UART RX: GPIO16, TX: GPIO17");
          ESP_LOGI("platform_standalone", "Standalone mode: ${standalone_mode}");
          ESP_LOGI("platform_standalone", "===========================================");

esp32:
  board: esp32dev
  framework:
    type: arduino

# WiFi - always enabled for OTA and logging
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  ap:
    # Kept short: SSIDs are limited to 32 characters
    ssid: "desk-${desk_id}-sa-fallback"
    password: "desk12345"

captive_portal:

# API for Home Assistant - useful in standalone mode
api:
  encryption:
    key: !secret api_encryption_key

# OTA updates
ota:
  platform: esphome
  password: !secret ota_password

logger:
  level: DEBUG
  # Serial (USB) logging stays enabled: the desk UART is on GPIO16/17 (UART2),
  # which does not conflict with UART0 logging on ESP32

# Built-in web UI (http://<device>.local) — lets the bench test run with no
# Home Assistant dependency: switches/buttons are operable from any browser
web_server:
  port: 80

# External component for desk height sensing (local development)
external_components:
  - source:
      type: local
      path: ../../components
    components: [standing_desk_height]

# UART for desk communication (WN17CM3 @ 19200 baud)
uart:
  id: standing_desk_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 19200

# Global variables for state tracking
globals:
  - id: current_command
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: is_moving
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_height_report_time
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Desk height sensor
sensor:
  - platform: standing_desk_height
    id: desk_height
    name: "Desk ${desk_id} Height"
    unit_of_measurement: "cm"
    # This desk model reports INCHES over UART (verified on hardware
    # 2026-07-27: sitting height read 24.50 raw = 62cm). Convert to cm so
    # heights match the sync controller's cm-based thresholds.
    filters:
      - multiply: 2.54
    variant: wn17cm3
    update_interval: 100ms  # Fast updates for sync
    accuracy_decimals: 2
    on_value:
      then:
        - lambda: |-
            // Standalone: no master, so height reports stay local. This mirrors
            // the slave config's report throttling (~10Hz or significant change)
            // for structural parity with platform_slave.yaml.
            static float last_reported = 0;
            uint32_t now = millis();
            float height = id(desk_height).state;

            // Report if: enough time passed OR height changed significantly
            bool time_elapsed = (now - id(last_height_report_time)) >= 100;  // 10Hz
            bool height_changed = abs(height - last_reported) >= 0.05;  // 0.5mm change

            if ((time_elapsed || height_changed) && !isnan(height)) {
              id(last_height_report_time) = now;
              last_reported = height;

              // Format: "H<id>:<height>" e.g., "H2:72.35"
              char msg[16];
              snprintf(msg, sizeof(msg), "H${desk_id}:%.2f", height);

              ESP_LOGV("platform_standalone", "Height report (local only): %s", msg);
            }

  # WiFi signal for debugging
  - platform: wifi_signal
    name: "Desk ${desk_id} WiFi Signal"
    update_interval: 60s

  # Uptime sensor
  - platform: uptime
    name: "Desk ${desk_id} Uptime"
    update_interval: 60s

# Binary sensor for movement status
binary_sensor:
  - platform: template
    name: "Desk ${desk_id} Moving"
    id: desk_moving
    lambda: return id(is_moving);

# Text sensor for current command/status
text_sensor:
  - platform: template
    name: "Desk ${desk_id} Status"
    id: desk_status
    lambda: |-
      if (id(is_moving)) {
        return id(current_command);
      }
      return std::string("idle");
    update_interval: 1s

# Standalone: no ESP-NOW — this board never talks to a master.
# See platform_slave.yaml for the ESP-NOW slave configuration.

# Local control buttons (always available for testing)
# Up/Down drive the hold switches so the 100ms re-send interval keeps the desk
# moving — a single move command only nudges the desk (Dec 13 hardware finding).
button:
  - platform: template
    name: "Desk ${desk_id} Up"
    icon: mdi:arrow-up-bold
    entity_category: diagnostic
    on_press:
      - switch.turn_on: desk_move_up
      - delay: 500ms
      - switch.turn_off: desk_move_up

  - platform: template
    name: "Desk ${desk_id} Down"
    icon: mdi:arrow-down-bold
    entity_category: diagnostic
    on_press:
      - switch.turn_on: desk_move_down
      - delay: 500ms
      - switch.turn_off: desk_move_down

  - platform: template
    name: "Desk ${desk_id} Stop"
    icon: mdi:stop
    on_press:
      - lambda: |-
          id(desk_height)->stop();
          id(is_moving) = false;
          id(current_command) = "";

  - platform: template
    name: "Desk ${desk_id} Preset 1"
    icon: mdi:numeric-1-box
    on_press:
      - lambda: |-
          id(desk_height)->preset(1);
          id(is_moving) = true;
          id(current_command) = "PRESET1";

  - platform: template
    name: "Desk ${desk_id} Preset 2"
    icon: mdi:numeric-2-box
    on_press:
      - lambda: |-
          id(desk_height)->preset(2);
          id(is_moving) = true;
          id(current_command) = "PRESET2";

  - platform: template
    name: "Desk ${desk_id} Preset 3"
    icon: mdi:numeric-3-box
    on_press:
      - lambda: |-
          id(desk_height)->preset(3);
          id(is_moving) = true;
          id(current_command) = "PRESET3";

  - platform: template
    name: "Desk ${desk_id} Preset 4"
    icon: mdi:numeric-4-box
    on_press:
      - lambda: |-
          id(desk_height)->preset(4);
          id(is_moving) = true;
          id(current_command) = "PRESET4";

  - platform: restart
    name: "Desk ${desk_id} Restart"

# Status LED
status_led:
  pin: GPIO2

# Switches for hold-to-move control (use with Lovelace button-card hold_action)
switch:
  - platform: template
    name: "Desk ${desk_id} Move Up"
    id: desk_move_up
    icon: mdi:arrow-up-bold
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(is_moving) = true;
          id(current_command) = "UP";
    turn_off_action:
      - lambda: |-
          id(desk_height)->stop();
          id(is_moving) = false;
          id(current_command) = "";

  - platform: template
    name: "Desk ${desk_id} Move Down"
    id: desk_move_down
    icon: mdi:arrow-down-bold
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(is_moving) = true;
          id(current_command) = "DOWN";
    turn_off_action:
      - lambda: |-
          id(desk_height)->stop();
          id(is_moving) = false;
          id(current_command) = "";

# Interval to send repeated commands while switch is on
interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (id(desk_move_up).state) {
            id(desk_height)->move_up();
          } else if (id(desk_move_down).state) {
            id(desk_height)->move_down();
          }
